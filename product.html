<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المنتج | صيدلية كوانيني</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/design.css">
<link rel="icon" href="/logo.webp" type="image/webp">
<script src="/app.js"></script>
<script src="/design.js" defer></script>
</head>
<body>
<script>chrome('/products');</script>
<main><section><div class="wrap" id="box"></div></section></main>
<script>
function qp(n){var m=new RegExp('[?&]'+n+'=([^&]*)').exec(location.search);return m?decodeURIComponent(m[1]):''}
var p=P(qp('id')),b=document.getElementById('box');
if(!p){b.innerHTML='<div class="empty"><h2>المنتج مش موجود</h2><p><a href="/products">ارجع للمنتجات</a></p></div>';}
else{document.title=p.name+' | صيدلية كوانيني';
var u='';for(var i=0;i<p.uses.length;i++){u+='<li><b>'+p.uses[i][0]+'</b><br>'+p.uses[i][1]+'</li>'}
var v=p.video?'<div class="video-box"><iframe src="'+p.video+'" allowfullscreen title="فيديو المنتج"></iframe></div>':'<div class="video-box">فيديو المنتج قريبًا</div>';
b.innerHTML='<div class="detail"><div class="detail-img"><img src="'+p.img+'" alt="'+p.name+'"></div><div><h1>'+p.name+'</h1><div class="brandline">'+p.brand+'</div><div class="price">'+p.price+' جنيه</div><p>'+p.short+'</p><ul class="uses">'+u+'</ul><button class="add-btn" id="add">أضف للسلة</button></div></div>'+v;
document.getElementById('add').addEventListener('click',function(){addToCart(p.id);this.textContent='تمت الإضافة ✓';this.classList.add('added');var t=this;setTimeout(function(){t.textContent='أضف للسلة';t.classList.remove('added')},1600)});}
</script>
</body>
</html>
