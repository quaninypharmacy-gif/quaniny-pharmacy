<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>السلة وإتمام الطلب | صيدلية كوانيني</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="/logo.webp" type="image/webp">
<script src="/app.js"></script>
</head>
<body>
<script>chrome('/products');</script>
<main>
<div class="pagehead" id="ph"><div class="wrap"><h1>سلة المشتريات</h1><p>منتجات العناية والتجميل — أكّد الطلب من غير ما تكلم حد، والدفع عند الاستلام.</p></div></div>
<section><div class="wrap" style="max-width:640px">
<div id="items"></div>
<div id="checkout" style="display:none">
<div class="freeship" id="fs"></div>
<div class="total-box"><span>الإجمالي</span><span id="total"></span></div>
<div class="form-card">
<div class="field"><label for="n">الاسم</label><input id="n" type="text" autocomplete="name"></div>
<div class="field"><label for="t">رقم التليفون</label><input id="t" type="tel" inputmode="numeric" autocomplete="tel" placeholder="01xxxxxxxxx"></div>
<div class="field"><label for="a">العنوان بالتفصيل</label><textarea id="a"></textarea></div>
<div class="field"><label for="nt">ملاحظات (اختياري)</label><textarea id="nt" style="min-height:70px"></textarea></div>
<button class="submit-btn purple" id="send">تأكيد الطلب</button>
<p class="form-hint">الدفع عند الاستلام — هنكلمك لتأكيد الموعد.</p>
<div class="err" id="err" style="display:none"></div>
</div>
<p class="privacy-note">بياناتك بتتبعت لفريق الصيدلية فقط لتنفيذ الطلب.</p>
</div>
</div></section>
</main>
<script>
/* بيوري العميل قد إيه ناقصه للتوصيل المجاني. الرقم من FREE_DELIVERY_MIN
   في app.js — متكتبوش هنا تاني. */
function freeship(tot){
 var el=document.getElementById('fs');if(!el)return;
 if(tot>=FREE_DELIVERY_MIN){
  el.className='freeship done';
  el.innerHTML='<span class="ico">🛵</span><span class="txt"><b>التوصيل مجاني على طلبك</b></span>';
 }else{
  var left=FREE_DELIVERY_MIN-tot;
  el.className='freeship';
  el.innerHTML='<span class="ico">🛵</span><span class="txt">ناقصك <b>'+left+' جنيه</b> والتوصيل يبقى مجاني'+
   '<span class="track"><i style="width:'+Math.round(tot/FREE_DELIVERY_MIN*100)+'%"></i></span></span>';
 }
}
function render(){
 var c=getCart(),box=document.getElementById('items'),h='',tot=0;
 if(!c.length){box.innerHTML='<div class="empty"><p>السلة فاضية.</p><p><a href="/products">تصفح المنتجات</a></p></div>';document.getElementById('checkout').style.display='none';return}
 for(var i=0;i<c.length;i++){var p=P(c[i].id);if(!p)continue;tot+=p.price*c[i].q;
 h+='<div class="cart-row"><img src="'+p.img+'" alt="'+p.name+'"><div class="cart-info"><div class="n">'+p.name+'</div><div class="p">'+p.price+' جنيه</div></div><div class="qty"><button data-a="-" data-id="'+p.id+'">−</button><span>'+c[i].q+'</span><button data-a="+" data-id="'+p.id+'">+</button></div></div>';}
 box.innerHTML=h;document.getElementById('checkout').style.display='';document.getElementById('total').textContent=tot+' جنيه';freeship(tot);
}
render();
document.getElementById('items').addEventListener('click',function(e){var b=e.target.closest('button[data-id]');if(!b)return;var id=b.getAttribute('data-id'),c=getCart(),q=0;for(var i=0;i<c.length;i++)if(c[i].id===id)q=c[i].q;setQty(id,b.getAttribute('data-a')==='+'?q+1:q-1);render();});
function showErr(m){var e=document.getElementById('err');e.textContent=m;e.style.display='';}
document.getElementById('send').addEventListener('click',async function(){
 track('begin_checkout',{currency:'EGP',value:getCart().reduce(function(t,i){var p=P(i.id);return t+(p?p.price*i.q:0)},0)});
 var btn=this,n=document.getElementById('n').value.trim(),t=document.getElementById('t').value.trim(),a=document.getElementById('a').value.trim(),nt=document.getElementById('nt').value.trim();
 document.getElementById('err').style.display='none';
 if(n.length<2){showErr('من فضلك اكتب اسمك.');return}
 if(!/^0?1[0-9]{9}$/.test(t.replace(/\s|-/g,''))){showErr('رقم التليفون مش مظبوط.');return}
 if(a.length<6){showErr('من فضلك اكتب العنوان بالتفصيل.');return}
 var c=getCart(),items=[];
 for(var i=0;i<c.length;i++){var p=P(c[i].id);if(p)items.push({name:p.name,qty:c[i].q,price:p.price})}
 if(!items.length){showErr('السلة فاضية.');return}
 btn.disabled=true;btn.textContent='جاري الإرسال...';
 try{
  var r=await fetch('/api/order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n,phone:t,address:a,note:nt,items:items})});
  var d=await r.json().catch(function(){return{}});
  if(!r.ok||!d.ok)throw new Error((d&&d.error)||('http_'+r.status));
  try{localStorage.removeItem('qcart')}catch(e){}
  document.getElementById('ph').style.display='none';
  track('purchase',{transaction_id:d.orderNo,currency:'EGP',value:d.total});
  document.querySelector('section .wrap').innerHTML='<div class="receipt"><div class="tick">✓</div><h2>تم استلام طلبك</h2><p>فريق الصيدلية هيراجعه ويتصل بيك لتأكيد الموعد.</p><div class="no">'+d.orderNo+'</div><div class="meta">الإجمالي: <b>'+d.total+' جنيه</b></div><span class="cod">الدفع عند الاستلام</span><p style="margin-top:22px"><a href="/products">ارجع للمنتجات</a></p></div>';
  updateBadge();
 }catch(e){
  btn.disabled=false;btn.textContent='تأكيد الطلب';
  showErr('معلش، حصلت مشكلة في الإرسال ('+(e.message||'')+'). حاول تاني أو اتصل بينا على '+PHONE+'.');
 }
});
</script>
</body>
</html>
