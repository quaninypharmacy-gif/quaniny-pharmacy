<body class="inner-page">
<script>chrome('/products');</script>
<main>
<div class="pagehead"><div class="wrap"><div class="page-emblem"><svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#bottle"></use></svg></div><div class="eyebrow">صيدلية كوانيني · صحتك أولويتنا</div><h1>منتجات العناية والتجميل</h1><p>اختار، ضيف للسلة، وأكّد الطلب — توصيل لحد باب البيت.</p></div></div>
<section><div class="wrap">
<div class="freeship plain"><span class="ico">🛵</span><span class="txt">التوصيل <b>مجاني</b> للطلبات من <b>200 جنيه</b> فأكتر</span></div>
<div class="catalog-heading"><div><span class="eyebrow">اختيارات كوانيني</span><h2>العناية اللي تناسب يومك</h2></div><a class="text-link" href="/ask">محتاج مساعدة في الاختيار؟ <svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#arrow"></use></svg></a></div><div class="prod-grid" id="grid"></div></div></section>
</main>
<script>
var g=document.getElementById('grid'),h='';
for(var i=0;i<PRODUCTS.length;i++){var p=PRODUCTS[i];
h+='<div class="prod-card"><a class="thumb" href="/product?id='+p.id+'"><img src="'+p.img+'" alt="'+p.name+'" loading="lazy"></a><div class="prod-body"><div class="prod-brand">'+p.brand+'</div><a class="prod-name" href="/product?id='+p.id+'">'+p.name+'</a><div class="prod-price">'+p.price+' جنيه</div><button class="add-btn" data-id="'+p.id+'">أضف للسلة</button></div></div>';}
g.innerHTML=h;
g.addEventListener('click',function(e){var b=e.target.closest('.add-btn');if(!b)return;addToCart(b.getAttribute('data-id'));b.textContent='تمت الإضافة ✓';b.classList.add('added');setTimeout(function(){b.textContent='أضف للسلة';b.classList.remove('added')},1600);});
</script>
</body>
